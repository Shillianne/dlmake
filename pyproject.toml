[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "dlmake"
version = "0.2.1"
description = "A library that groups all necesities for training and evaluating transformers (and maybe other networks)"
readme = "README.md"
requires-python = ">=3.12.0"
dependencies = [
    "matplotlib>=3.10.8", "tiktoken>=0.12.0", "torchmetrics==1.9.0", "torchvision==0.29.1", "bitsandbytes==0.49.1", "pyyaml==6.0.3"
]
keywords = ["Python", "Machine Learning"]
classifiers = [
	"Programming Language :: Python",
	"Intended Audience :: Developers",
	"Topic :: Scientific/Engineering :: Artificial Intelligence",
	"Development Status :: 4 - Beta",
	"Environment :: GPU :: NVIDIA CUDA",
	"Framework :: FastAPI",
	"License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
]
authors = [
	{name = "Shillianne", email = "shillianne@proton.me"},
]
license = {file = "LICENSE"}

[project.urls]
Repository = "https://github.com/Shillianne/dlmake.git"
Issues = "https://github.com/Shillianne/dlmake/issues"

[project.optional-dependencies]
server = [
	"fastapi[standard]>=0.162.0",
]
