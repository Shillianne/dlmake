name: test_mha_simple_json
ctx_size: 32
max_ctx_size: 32
vocab_size: 1024
embed_dim: 16
nhead: 4
nlayers: 8
batch_size: 4
max_batch_size: 4
bias: false
dtype: float32
norm: RMSNorm
prenorm: false
postnorm: true
use_looping: true
training:
  tokens_per_epoch: 2048
  max_lr: 1.0e-4
  min_lr: 1.0e-7
  optimizer: Adam
  use_fused: false
  compile: true
  checkpoint_rate: 150
  save_history: true
  use_val: true
  train_size: 0.7
  test_size: 0.15
  val_size: 0.15
  test_rate: 100
  val_rate: 200
  benchmark_rate: 300
  train_epochs: 150000
  warmup_steps: 1500
  shuffle_data: true
  new: false
  logging:
    verbose: false
    time_precision: ms
    train_progress_config:
      train_progress: true
      model_progress: true
      lr: true
      norm: true
      mfu: true
      time: true
      tok: true
      eta: true
    test_progress_config:
      train_progress: true
      model_progress: true
      lr: true
      norm: true
      mfu: true
      time: true
      tok: true
      eta: true
    val_progress_config:
      train_progress: true
      model_progress: true
      lr: true
      norm: true
      mfu: true
      time: true
      tok: true
      eta: true
feed_forward:
  linear_scale: 3
  nlinear: SiLU
  dropout: 0.1
  ff: MoE
  shallow_ff: LlamaFeedForward
  shallow_threshold: 2
  bias: false
  moe:
    n_experts: 8
    experts_per_tok: 2
    use_shared: true
    hidden_dim: 32
    nlinear: ReLU
    router_scaling: 1.5
    score_function: sigmoid
    bias: false
    use_latent: true
    latent_dim: 8
    latent_shared: true
attention:
  attention_method: GroupedQueryAttention
  use_rope: false
  use_qknorm: false
  qk_norm_type: LayerNorm
  n_kv_groups: 2
  q_head_dim: 100
  v_head_dim: 100
  kv_lora_dim: 200
  flash: true
  doc_aware: true
  dropout: 0.1
  bias: false
