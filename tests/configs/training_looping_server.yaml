name: TrainingTestNoServer
ctx_size: 256
max_ctx_size: 256
vocab_size: 51200
embed_dim: 16
nhead: 4
nlayers: 8
batch_size: 4
max_batch_size: 4
bias: false
dtype: bfloat16
norm: RMSNorm
prenorm: false
postnorm: true
use_looping: true
training:
  tokens_per_epoch: 4096
  loaded_tokens: 16384
  min_lr: 1.0e-7
  optimizer: AdamW
  scheduler: OneCycleLR
  scheduler_options:
    max_lr: 1.0e-3
    total_steps: 25
  loss: OuroLoss
  loss_options:
    beta: 0.01
  accuracy: LoopingAccuracy
  use_fused: true
  compile: true
  checkpoint_rate: 150
  save_history: false
  use_val: false
  train_size: 0.8
  test_size: 0.2
  val_size: 0.0
  test_rate: 100
  benchmark_rate: 10
  train_epochs: 25
  server:
    host: 127.0.0.1
    port: 21321
  logging:
    verbose: true
    time_precision: ms
    metrics:
      - lr
      - norm
      - mfu
      - time
      - tok
      - eta
    benchmarks:
      - hellaswag
      - mmlu
feed_forward:
  linear_scale: 4
  nlinear: GELU
  dropout: 0.0
  ff: GPTFeedForward
  bias: false
attention:
  attention_method: GroupedQueryAttention
  use_rope: true
  use_qknorm: true
  qk_norm_type: RMSNorm
  n_kv_groups: 2
  flash: true
  dropout: 0.0
  bias: false
looping:
  n_max_loops: 4
  looping_behaviour: full
